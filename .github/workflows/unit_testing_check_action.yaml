name: Flutter Testing

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8

      - name: Flutter Version
        run: flutter --version

      - name: Install packages
        run: flutter pub get
        
      - name: Run tests
        run: flutter test

